name: Deploy BeatSync to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    name: Build & Deploy PWA
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application (PWA)
        run: npm run build:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://ekcclgvuhzyrntzmhwsa.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrY2NsZ3Z1aHp5cm50em1od3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4Njg5MDAsImV4cCI6MjEwODQ0NDkwMH0.-Rgo54hku4KXM0sZSdS5Ea_ZJLVQOuGWXftPYMZAnMY' }}

      # cloudflare/pages-action was deprecated and removed; wrangler-action is the official replacement.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9c6e869109219131bf45980270f87dfc' }}
          command: pages deploy dist --project-name=beatsync --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
